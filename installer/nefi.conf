# NEFI OS - configurazione di simple-cdd
profiles="nefi"
auto_profiles="nefi"
debian_mirror="http://deb.debian.org/debian/"
security_mirror="http://security.debian.org/debian-security/"
mirror_components="main contrib non-free non-free-firmware"
DISKINFO="NEFI OS 0.2 amd64"
MAXCDS=1
ARCHES="amd64"
# ISO in formato DVD (4.7 GB): il CD da 650 MB non basta
DISKTYPE="DVD"
NONFREE_COMPONENTS="non-free non-free-firmware"
# Firmware anche nella cartella /firmware della ISO (lo usa l'installer)
FORCE_FIRMWARE=1
# Pacchetti NEFI (.deb costruiti in packages/out)
local_packages="/home/nefios/nefi-os/packages/out"
