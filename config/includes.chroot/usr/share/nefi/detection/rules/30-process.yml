# NEFI OS - comportamento dei processi (auditd execve: category process_creation).
title: Program executed from a temporary directory
id: nefi-proc-temp-exec
description: A program was started from /tmp, /var/tmp, /dev/shm or /run/user. Legitimate software is rarely installed there; downloaded or dropped tools often are.
level: medium
tags: [attack.execution, attack.defense_evasion, attack.t1204, attack.t1036]
logsource: {product: linux, category: process_creation}
detection:
  selection: {'Image|startswith': [/tmp/, /var/tmp/, /dev/shm/, /run/user/]}
  filter_appimage: {'Image|contains': ['/.mount_', '/appimage']}
  condition: selection and not filter_appimage
falsepositives: [Installers and build systems, AppImage programs, Scripts extracted by package managers]
nefi_title: 'Program run from a temporary directory: {Image}'
nefi_dedup: [Image]
---
title: Shell started by a network service
id: nefi-proc-service-shell
description: A web, database, mail, DNS, file or print server started a command shell. Servers do not normally do this; it is the typical result of a vulnerability being exploited in the service.
level: high
tags: [attack.execution, attack.initial_access, attack.persistence, attack.t1059.004, attack.t1190, attack.t1505.003]
logsource: {product: linux, category: process_creation}
detection:
  parent:
    'ParentImage|endswith': [/nginx, /apache2, /httpd, /lighttpd, /php-fpm, /mysqld, /mariadbd, /postgres,
                             /redis-server, /named, /smbd, /vsftpd, /proftpd, /cupsd, /exim4, /dovecot, /squid,
                             /tomcat, /memcached, /mongod]
  shell: {'Image|endswith': [/sh, /bash, /dash, /zsh, /ksh, /busybox]}
  condition: parent and shell
falsepositives: [Maintenance scripts started by the service, CUPS filters, Mail delivery scripts]
nefi_title: 'Shell started by a network service: {ParentImage} -> {Image}'
nefi_dedup: [ParentImage, Image]
---
title: Unusual program running with root privileges through SUID
id: nefi-proc-suid-unusual
description: A user started a program that runs as root because of its SUID bit, and the program is not one of the standard Debian SUID tools.
level: high
tags: [attack.privilege_escalation, attack.t1548.001]
logsource: {product: linux, category: process_creation}
detection:
  selection: {EffectiveUser: root}
  filter_root: {User: root}
  filter_known:
    'Image|endswith': [/sudo, /su, /pkexec, /passwd, /mount, /umount, /fusermount, /fusermount3, /chfn, /chsh,
                       /gpasswd, /newgrp, /expiry, /chage, /at, /crontab, /unix_chkpwd, /ssh-keysign,
                       /dbus-daemon-launch-helper, /polkit-agent-helper-1, /Xorg.wrap, /ntfs-3g, /pppd, /bwrap,
                       /chrome-sandbox, /firejail, /exim4, /ping, /kcheckpass, /start_kdeinit, /sudoedit,
                       /mount.nfs, /mount.cifs, /snap-confine, /utempter, /write, /wall, /ssh-agent,
                       /VBoxHeadless, /VBoxNetAdpCtl, /vmware-user-suid-wrapper, /doas, /newuidmap, /newgidmap]
  condition: selection and not filter_root and not filter_known
falsepositives: [Third-party software that installs its own SUID helper]
nefi_title: 'Unusual SUID root program run by {User}: {Image}'
nefi_dedup: [Image, User]
---
title: Root shell started by an unprivileged process
id: nefi-proc-root-shell
description: A shell runs as root, but its parent process belongs to a normal user and is not sudo, su, pkexec or a login program. This is what a successful local privilege escalation usually looks like.
level: critical
tags: [attack.privilege_escalation, attack.t1068, attack.t1548]
logsource: {product: linux, category: process_creation}
detection:
  selection:
    User: root
    'Image|endswith': [/sh, /bash, /dash, /zsh, /ksh]
    'ParentUser|exists': true
  filter_parent_root: {ParentUser: [root, unset, '']}
  filter_parent_tool:
    'ParentImage|endswith': [/sudo, /su, /pkexec, /login, /sshd, /sshd-session, /sddm-helper, /doas, /newgrp,
                             /systemd, /polkit-agent-helper-1, /runuser, /cron, /atd, /machinectl, /firejail]
  condition: selection and not filter_parent_root and not filter_parent_tool
nefi_title: 'Root shell started by {ParentUser} via {ParentImage}'
