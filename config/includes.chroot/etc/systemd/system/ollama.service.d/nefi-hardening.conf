# NEFI OS - Ollama in sandbox: solo rete locale (127.0.0.1), niente poteri di root,
# scrive solo nella cartella dei modelli.
[Service]
# crea la cartella dei modelli prima di attivare la sandbox ("+" = fuori dalla sandbox)
ExecStartPre=+/usr/bin/mkdir -p /root/.ollama
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=-/root/.ollama
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
LockPersonality=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
RemoveIPC=yes
UMask=0077
