# NEFI OS - kernel: meno strade per diventare root (Passo 2)
# Ogni riga chiude una tecnica usata spesso dagli exploit di escalation locale.

# niente kexec: impedisce di caricare un altro kernel "su misura" a sistema avviato
kernel.kexec_load_disabled = 1
# niente perf per gli utenti normali (fonte frequente di bug del kernel e di fughe di informazioni)
kernel.perf_event_paranoid = 3
# il JIT di BPF viene protetto contro lo "spraying" di codice
net.core.bpf_jit_harden = 2
# userfaultfd solo per root: usato da molti exploit per vincere le "race condition"
vm.unprivileged_userfaultfd = 0
# io_uring disattivato: interfaccia del kernel con molti bug di escalation negli ultimi anni
# (i programmi che lo usano passano automaticamente al metodo classico)
kernel.io_uring_disabled = 2
# niente caricamento automatico delle "line discipline" dei terminali (bug storici)
dev.tty.ldisc_autoload = 0
# SysRq spento: niente comandi "magici" da tastiera (dump di memoria, kill di massa, ...)
kernel.sysrq = 0
# i programmi SUID non lasciano file core con dati di root
fs.suid_dumpable = 0

# ── valori consigliati da Lynis (KRNL-6000) ──
kernel.core_uses_pid = 1
net.ipv4.conf.all.forwarding = 0
net.ipv4.conf.all.proxy_arp = 0
net.ipv4.conf.all.bootp_relay = 0
net.ipv4.conf.default.log_martians = 1
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_timestamps = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.default.accept_source_route = 0
